services:
  ui:
    build:
      context: ./packages/ui
      dockerfile: Dockerfile.dev
    container_name: music-pipeline-ui-dev
    ports:
      - "3000:3000"
    volumes:
      - ./packages/ui:/app
      - /app/node_modules  # Preserve container's node_modules
      - /app/.nuxt          # Preserve container's .nuxt build cache
      - ui-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - /media:/media:rw
    environment:
      - NODE_ENV=development
      - HOST_DOWNLOADS_DIR=${DOWNLOADS_DIR:-${PWD}/downloads}
    depends_on:
      - slskd

  slskd:
    image: slskd/slskd:latest
    container_name: music-pipeline-slskd
    command: ["--no-auth"]
    ports:
      - "5030:5030"
      - "5031:5031"
    volumes:
      - slskd-data:/app
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ${INCOMPLETE_DIR:-./incomplete}:/app/incomplete
      - ${MUSIC_DIR:-./music}:/music
      - ./slskd.yml:/app/slskd.yml
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSKD_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD:-}

  analyzer:
    build:
      context: ./packages/analyzer
      dockerfile: Dockerfile
    image: music-analyzer
    profiles:
      - tools
    volumes:
      - ${DOWNLOADS_DIR:-./downloads}:/input:ro
      - ${MUSIC_DIR:-./music}:/output

volumes:
  ui-data:
  slskd-data:
