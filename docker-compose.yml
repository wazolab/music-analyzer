services:
  ui:
    build:
      context: ./packages/ui
      dockerfile: Dockerfile
    container_name: music-pipeline-ui
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - ${DOCKER_GID:-999}
    ports:
      - "3000:3000"
    volumes:
      - ui-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - /media:/media:rw
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DOWNLOADS_DIR=/app/downloads
      - HOST_DOWNLOADS_DIR=${DOWNLOADS_DIR:-${PWD}/downloads}
      - UID=${UID:-1000}
      - GID=${GID:-1000}
      - ANALYZER_URL=http://analyzer:8000
    depends_on:
      - slskd
      - analyzer
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: music-pipeline-slskd
    user: "${UID:-1000}:${GID:-1000}"
    command: ["--no-auth"]
    ports:
      - "5030:5030"
      - "5031:5031"
    volumes:
      - slskd-data:/app
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ${INCOMPLETE_DIR:-./incomplete}:/app/incomplete
      - ${MUSIC_DIR:-./music}:/music
      - ./slskd.yml:/app/slskd.yml
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSKD_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD:-}
    restart: unless-stopped

  analyzer:
    build:
      context: ./packages/analyzer
      dockerfile: Dockerfile
    image: music-analyzer
    container_name: music-pipeline-analyzer
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ${DOWNLOADS_DIR:-./downloads}:/input:rw
      - ${MUSIC_DIR:-./music}:/output
      - /media:/media:rw
    environment:
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - ACOUSTID_USER_KEY=${ACOUSTID_USER_KEY:-}
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      - PORT=8000
    restart: unless-stopped

volumes:
  ui-data:
  slskd-data:
