services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: music-pipeline-ui
    ports:
      - "3000:3000"
    volumes:
      - ui-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
    depends_on:
      - slskd
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: music-pipeline-slskd
    ports:
      - "5030:5030"
      - "5031:5031"
    volumes:
      - slskd-data:/app
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${MUSIC_DIR:-./music}:/music
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    restart: unless-stopped

volumes:
  ui-data:
  slskd-data:
