services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: music-pipeline-ui
    ports:
      - "3000:3000"
    volumes:
      - ui-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
    depends_on:
      - slskd
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: music-pipeline-slskd
    command: ["--no-auth"]
    ports:
      - "5030:5030"
      - "5031:5031"
    volumes:
      - slskd-data:/app
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ${INCOMPLETE_DIR:-./incomplete}:/app/incomplete
      - ${MUSIC_DIR:-./music}:/music
      - ./slskd.yml:/app/slskd.yml
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSKD_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD:-}
    restart: unless-stopped

volumes:
  ui-data:
  slskd-data:
